[project]
name = "duck-training"
version = "0.1.0"
description = "duck-robot 自建 real2sim2real 学习工程：只借鉴公开物理参数，模型/环境/训练全部自写"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.5",
]

[tool.uv]
# Windows 下 pypi 的 torch 即 CPU 版；大规模训练再评估 WSL/CUDA
