# banana_pcb 电池转接板下单参数（板框出自 banana_pcb.kicad_pcb Edge.Cuts 实测）
# 用法: python -m jlc_order pcb quote -p examples/banana_pcb.toml

[board]
length = 39.2          # 板长 mm（实测 39.19，报价取整留余量）
width = 6.8            # 板宽 mm（实测 6.79）
layers = 2             # 双层板
quantity = 5           # 打样 5 片
thickness = 1.6        # 板厚 mm
color = "绿色"          # 阻焊颜色
surface_finish = "无铅喷锡"  # 焊盘喷镀：有铅喷锡/无铅喷锡/沉金
copper_thickness = 1.0 # oz（外层仅 1/2）
test = "全部测试"       # 不测试/抽测/全部测试/测试一半/随机抽测
plate_type = 1         # 板材：1=FR-4（详见 pcb_params.py ALLOWED_PLATE_TYPE）

# [extra] 段原样并入请求顶层（如 acheiveTimeType 等可选工艺字段）
# [extra]
